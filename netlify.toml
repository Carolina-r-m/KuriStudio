# Configuración de Netlify: la web está en la raíz y la función del chat en netlify/functions
[build]
  publish = "."
  functions = "netlify/functions"

# Cabeceras básicas de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Las fotos se guardan en caché una semana para que la web cargue más rápido
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Las notas internas están en el repositorio pero no se enseñan en la web
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true
