# Configuración de Netlify. Al publicar, build.mjs comprime y ofusca la web en dist/
# La función del chat está en netlify/functions (va al servidor, nadie la ve)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Cabeceras básicas de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Las fotos se guardan en caché una semana para que la web cargue más rápido
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Las notas internas están en el repositorio pero no se enseñan en la web
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true
